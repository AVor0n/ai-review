# Сборка приложения в трее (app/, Tauri 2) для macOS и Windows. Тег app-v<версия> собирает обе и публикует GitHub Release;
# ручной запуск (Actions → app → Run workflow) — проверка сборки без релиза, только артефакты прогона.
# Подписи и нотаризации нет. Артефакты — pr-reviewer-macOS и pr-reviewer-Windows
name: app

on:
    workflow_dispatch:
    push:
        tags: ['app-v*']

concurrency:
    group: app-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Тег совпадает с версией приложения
              if: startsWith(github.ref, 'refs/tags/app-v')
              run: |
                  want="app-v$(jq -r .version app/src-tauri/tauri.conf.json)"
                  test "$GITHUB_REF_NAME" = "$want" || { echo "Тег $GITHUB_REF_NAME, а версия приложения — $want"; exit 1; }
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: app/package-lock.json
            - name: Тесты сервиса
              run: npm test
            - name: Приложение — зависимости
              working-directory: app
              run: npm ci
            - name: Типы API совпадают со схемой
              working-directory: app
              run: npm run check:api
            - name: Приложение — типы и тесты
              working-directory: app
              run: npx tsc --noEmit && npm test

    build:
        needs: check
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      args: --target universal-apple-darwin --bundles app,dmg
                      artifact: app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
                    - os: windows-latest
                      args: --bundles nsis
                      artifact: app/src-tauri/target/release/bundle/nsis/*.exe
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: app/package-lock.json
            # Версия Rust и цели сборки — из app/rust-toolchain.toml, rustup ставит их сам
            - name: Rust
              working-directory: app
              run: rustup toolchain install
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: app/src-tauri
            - name: Зависимости
              working-directory: app
              run: npm ci
            - name: Сборка
              working-directory: app
              run: npx tauri build ${{ matrix.args }}
            - uses: actions/upload-artifact@v7
              with:
                  name: pr-reviewer-${{ runner.os }}
                  path: ${{ matrix.artifact }}
                  if-no-files-found: error

    release:
        needs: build
        if: startsWith(github.ref, 'refs/tags/app-v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v8
              with:
                  path: dist
                  merge-multiple: true
            - name: GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  version="${GITHUB_REF_NAME#app-v}"
                  cat > notes.md <<EOF
                  PR Reviewer tray app $version.

                  - macOS (Apple Silicon and Intel): \`.dmg\`. Not signed or notarized: after the first launch is blocked, allow it in System Settings → Privacy & Security → Open Anyway.
                  - Windows: \`…_x64-setup.exe\`. Not signed: on first run choose "More info → Run anyway".

                  The app needs the PR Reviewer service running (macOS: \`./install.sh\`; Windows: the service in WSL2). See README.
                  EOF
                  gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "PR Reviewer $version" --notes-file notes.md
