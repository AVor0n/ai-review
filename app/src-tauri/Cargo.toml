[package]
name = "pr-reviewer-app"
version = "0.1.1"
edition = "2021"
publish = false

[lib]
name = "pr_reviewer_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Уведомление с откликом на нажатие: плагин уведомлений на десктопе нажатие не сообщает
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

# Proc-macro библиотеки после strip на новых macOS не грузятся (dyld: mis-aligned LINKEDIT string pool) — их не обрезаем
[profile.release.build-override]
strip = false
